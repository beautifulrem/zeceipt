<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <radialGradient id="glow" cx="0.28" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#2a2410"/>
      <stop offset="1" stop-color="#0b0d13"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <g transform="translate(120 176) scale(1.125)"><defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2230"/>
      <stop offset="1" stop-color="#0e1118"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7c948"/>
      <stop offset="1" stop-color="#e9a21b"/>
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#d5d8df"/>
      <rect width="3" height="6" fill="#bfc3cc"/>
    </pattern>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)" stroke="#2c3346" stroke-width="2"/>
  <!-- the receipt: a slip with a torn bottom edge -->
  <path d="M68 40 H188 V206 l-10 -10 l-10 10 l-10 -10 l-10 10 l-10 -10 l-10 10 l-10 -10 l-10 10 l-10 -10 l-10 10 l-10 -10 l-10 10 Z" fill="#f6f3ea"/>
  <!-- other outputs stay shielded -->
  <rect x="86" y="64" width="84" height="14" rx="7" fill="url(#hatch)"/>
  <rect x="86" y="92" width="62" height="14" rx="7" fill="url(#hatch)"/>
  <rect x="86" y="160" width="74" height="14" rx="7" fill="url(#hatch)"/>
  <!-- one output, disclosed and verified -->
  <rect x="58" y="116" width="140" height="32" rx="16" fill="url(#gold)"/>
  <circle cx="78" cy="132" r="10" fill="#0e1118"/>
  <path d="M73 132.5 l3.6 3.6 l7 -7.4" fill="none" stroke="#f7c948" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="96" y="127" width="52" height="10" rx="5" fill="#0e1118" opacity="0.85"/>
  <rect x="156" y="127" width="28" height="10" rx="5" fill="#0e1118" opacity="0.45"/>
</g>
  <g font-family="-apple-system, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" fill="#f6f3ea">
    <text x="480" y="270" font-size="104" font-weight="700" letter-spacing="-3">zeceipt</text>
    <text x="484" y="338" font-size="32" fill="#f7c948" font-weight="600">Verifiable receipts for shielded Zcash payments</text>
    <text x="484" y="392" font-size="27" fill="#aab0bd">Disclose one output. Keep every other payment private.</text>
    <text x="484" y="470" font-size="22" fill="#6f7687">Rust · WASM · CLI · browser verifier · payout console</text>
  </g>
</svg>
