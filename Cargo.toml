[workspace]
resolver = "2"
members = [
    "crates/zeceipt-types",
    "crates/zeceipt-core",
    "crates/zeceipt-lwd",
    "crates/zeceipt-cli",
    "crates/zeceipt-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/beautifulrem/zeceipt"
rust-version = "1.88"

[workspace.dependencies]
# Zcash protocol crates: self-consistent set (librustzcash main, 2026-09-21)
orchard = { version = "0.15.5", default-features = false }
sapling-crypto = { version = "0.7", default-features = false }
zcash_note_encryption = "0.4.2"
zcash_primitives = { version = "0.30.1", default-features = false }
zcash_protocol = { version = "0.10.6", default-features = false }
zcash_address = { version = "0.13.0", default-features = false }
zcash_keys = { version = "0.16.1", default-features = false }
zcash_client_backend = { version = "0.24.0", default-features = false }
zip32 = { version = "0.2", default-features = false }

# crypto / encoding
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = "0.6"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

# network
tonic = { version = "0.14", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# cli
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
