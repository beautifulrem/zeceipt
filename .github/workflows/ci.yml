name: ci
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features zeceipt-core/synthetic -- -D warnings
      - run: cargo test --workspace --features zeceipt-core/synthetic
      - run: cargo run -q -p zeceipt-core --features synthetic --example make_synthetic
      - run: |
          ./target/debug/zeceipt keygen --out /tmp/k.key >/dev/null
          ./target/debug/zeceipt issue --raw-tx-file fixtures/synthetic-ironwood.hex --ovk "$(cat fixtures/synthetic-ovk.hex)" --label ci --key-file /tmp/k.key --out-dir /tmp/r >/dev/null
          ./target/debug/zeceipt verify /tmp/r/*.json --raw-tx-file fixtures/synthetic-ironwood.hex --require-signature
          ./target/debug/zeceipt pack --title ci /tmp/r/*.json > /tmp/pack.json
          mkdir -p /tmp/raw && cp fixtures/synthetic-ironwood.hex /tmp/raw/$(python3 -c "import json,glob;print(json.load(open(glob.glob('/tmp/r/*.json')[0]))['txid'])").hex
          ./target/debug/zeceipt verify-pack /tmp/pack.json --raw-tx-dir /tmp/raw --require-signature
          if ./target/debug/zeceipt verify; then exit 1; else test $? -eq 3; fi
      - name: no key-material flags (REQ-CLI-6)
        run: |
          if grep -nEi 'seed|mnemonic|spending' crates/zeceipt-cli/src/main.rs crates/zeceipt-wasm/src/lib.rs crates/zeceipt-lwd/src/lib.rs; then echo "key-material term found in a user-facing crate"; exit 1; fi
      - name: no secrets in logs (NFR-6)
        run: |
          if grep -rEn '(info|debug|warn|error|trace)!\(' crates/*/src | grep -Ei 'ock|ovk|memo'; then echo "log line mentions ock/ovk/memo"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: committed WASM package still agrees with the fixtures (staleness guard)
        run: node packages/verify/test/verify.mjs
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-pack --locked
      - run: wasm-pack build crates/zeceipt-wasm --target web --release --out-dir ../../packages/verify/pkg
