name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, so a new advisory against a locked dependency shows even without a push
# Every action is pinned to a commit (PM round 1, D31); the comment names the ref it was resolved from on 2026-09-30.
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features zeceipt-core/synthetic -- -D warnings
      - run: cargo test --workspace --features zeceipt-core/synthetic
      - name: the workspace without the synthetic feature builds, as a plain `cargo test` does (slice G1)
        run: cargo check --workspace --all-targets
      - run: cargo run -q -p zeceipt-core --features synthetic --example make_synthetic
      - run: |
          ./target/debug/zeceipt keygen --out /tmp/k.key >/dev/null
          ./target/debug/zeceipt issue --raw-tx-file fixtures/synthetic-ironwood.hex --ovk "$(cat fixtures/synthetic-ovk.hex)" --label ci --key-file /tmp/k.key --out-dir /tmp/r >/dev/null
          ./target/debug/zeceipt verify /tmp/r/*.json --raw-tx-file fixtures/synthetic-ironwood.hex --require-signature
          ./target/debug/zeceipt pack --title ci /tmp/r/*.json > /tmp/pack.json
          mkdir -p /tmp/raw && cp fixtures/synthetic-ironwood.hex /tmp/raw/$(python3 -c "import json,glob;print(json.load(open(glob.glob('/tmp/r/*.json')[0]))['txid'])").hex
          ./target/debug/zeceipt verify-pack /tmp/pack.json --raw-tx-dir /tmp/raw --require-signature
          if ./target/debug/zeceipt verify; then exit 1; else test $? -eq 3; fi
      - name: source guards — no key material in workspace code (NFR-1, REQ-CLI-6), no secrets in logs (NFR-6)
        run: python3 scripts/check_source_guards.py
      - name: design tokens — the receipt page carries the console's tokens, light and dark (slice F4)
        run: python3 scripts/check_design_tokens.py
      - name: product docs consistent (WBS/requirements/plan invariants, NFR-1 evidence pinned to the guard output)
        run: python3 scripts/check_product_docs.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: one version in every source, and the changelog's shape (release check, and its tests)
        run: python3 scripts/check_release.py && python3 scripts/test_check_release.py
      - name: committed WASM package still agrees with the fixtures (staleness guard)
        run: node packages/verify/test/verify.mjs
      - name: dossier pages' view logic on the real testnet dossier, their CSPs and the committed sample (case/, build/, landing)
        run: node packages/verify/test/dossier-view.mjs
      - name: "@zeceipt/verify as published: the tarball's files, public access, and the README's Node example through the installed package (offline)"
        run: node packages/verify/test/pack.mjs
      - name: public receipt page (packages/verify/r) in Chrome — link to VALID with the three parts, every state, and no request, header or storage carrying the receipt (REQ-CON-12)
        working-directory: packages/verify
        # playwright-core drives the runner's Google Chrome; the public gRPC-web node is intercepted, so no internet is needed.
        run: |
          npm ci --no-audit --no-fund
          ZECEIPT_BROWSER_E2E=1 node --test test/page.e2e.mjs
      - name: dossier pages (packages/verify/case, build, landing) in Chrome — the sample verifies, a tampered one fails, the builder reproduces it from the published testnet UFVK, no request carries the dossier or the key, axe clean light and dark
        working-directory: packages/verify
        run: ZECEIPT_BROWSER_E2E=1 node --test test/dossier.e2e.mjs
      - name: console library — install dependencies (lockfile; better-sqlite3 prebuilt binary), type check (TypeScript 7), lint (ESLint, zero warnings), unit tests against the debug zeceipt binary
        working-directory: apps/console
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit -p .
          npm run lint
          set -o pipefail
          ZECEIPT_BIN="$GITHUB_WORKSPACE/target/debug/zeceipt" node --test test/*.test.ts | tee "$RUNNER_TEMP/console-tests.log"  # absolute, as the config requires (REQ-CON-17)
      - name: console app — next build without ZECEIPT_* variables; next start boots, serves the API and pages (forms posted without JavaScript, and in Chrome with it); bad configuration exits 1 before answering (REQ-CON-17)
        working-directory: apps/console
        # ZECEIPT_BROWSER_E2E: the JavaScript-path test drives the runner's Google Chrome through playwright-core.
        run: |
          set -o pipefail
          ZECEIPT_APP_E2E=1 ZECEIPT_BROWSER_E2E=1 node --test test/app.e2e.test.ts | tee "$RUNNER_TEMP/app-e2e.log"
      - name: the test counts the README, the submission checklist and the WBS state are the counts these runs had (PM round 1, D15)
        run: python3 scripts/check_test_counts.py --console-log "$RUNNER_TEMP/console-tests.log" --app-e2e-log "$RUNNER_TEMP/app-e2e.log"
      - name: "design gallery: every console page, light and dark, desktop and phone: no overflow, no table scrolling inside its card on a desktop, no axe WCAG A/AA violation (slice F4)"
        working-directory: apps/console
        run: CHROME_PATH="$(command -v google-chrome)" node test/shots/gallery.ts "$RUNNER_TEMP/gallery"
  msrv:
    # The workspace's rust-version (1.88, the highest any dependency declares) is built, not only stated (PM round 1, D30).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --workspace --all-targets --features zeceipt-core/synthetic --locked
  security:
    # scripts/security_review.sh, as run by hand for docs/SECURITY_REVIEW.md: cargo audit, npm audit of both lockfiles,
    # gitleaks over every commit and the tree, and the source guards (PM round 1, D29).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks reads the whole history
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-audit
      - name: gitleaks 8.30.1 (the version the recorded reviews used), checked against its release checksum
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: scripts/security_review.sh
  site:
    # The public static site (scripts/build_site.sh) builds and its every page loads its verifier: pages.yml publishes
    # the same build (PM round 1, D08).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: scripts/build_site.sh "$RUNNER_TEMP/site"
  wasm:
    # Rebuilds the committed WASM on Linux with the same Rust, wasm-pack and wasm-bindgen it was measured with, and the
    # runner's clang 18 (Homebrew clang 23 on the Mac) (README, "Building the WASM package"; slices X3b, X3c): the
    # wasm-bindgen outputs must match the committed ones and the Linux build must pass the same checks; whether the
    # .wasm bytes match across platforms is reported in the job summary, not required. Pinned to the image R120 read,
    # whose apt provides clang-18 and llvm-18, so the comparison is repeatable.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - name: build the WASM package with the reproducible script, outside the committed pkg/
        run: ZECEIPT_WASM_CLANG=clang-18 ZECEIPT_WASM_AR=llvm-ar-18 scripts/build_wasm.sh --out-dir "$RUNNER_TEMP/pkg"
      - name: compare with the committed package (wasm-bindgen outputs must match; the .wasm is reported)
        run: scripts/build_wasm.sh --compare "$RUNNER_TEMP/pkg"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: the Linux-built package passes the committed package's checks
        run: ZECEIPT_PKG_DIR="$RUNNER_TEMP/pkg" node packages/verify/test/verify.mjs
