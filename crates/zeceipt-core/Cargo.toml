[package]
name = "zeceipt-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Zeceipt core: Zcash transaction parsing, OCK derivation, per-output recovery (Ironwood, Orchard, Sapling)"

[dependencies]
zeceipt-types = { path = "../zeceipt-types" }
orchard.workspace = true
sapling-crypto.workspace = true
zcash_note_encryption.workspace = true
zcash_primitives.workspace = true
zcash_protocol = { workspace = true, features = ["local-consensus"] }
zcash_address.workspace = true
zcash_keys = { workspace = true, features = ["orchard", "sapling"] }
hex.workspace = true
thiserror.workspace = true
# Dossiers (spec/dossier-v1.md): a funding transaction's transparent inputs, as the P2PKH addresses that signed them.
zcash_transparent = { version = "0.10.0", default-features = false }
ripemd = { version = "0.1", default-features = false }
sha2 = { version = "0.10", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true, optional = true }

[features]
default = []
## Offline test support: splice a fresh Ironwood output into a real v6 transaction.
synthetic = ["dep:rand"]

[dev-dependencies]
rand.workspace = true
ed25519-dalek.workspace = true
serde_json.workspace = true
base64.workspace = true

[[example]]
name = "make_synthetic"
required-features = ["synthetic"]

[[example]]
name = "make_above_max_money"
required-features = ["synthetic"]
