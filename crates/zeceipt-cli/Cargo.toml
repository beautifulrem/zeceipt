[package]
name = "zeceipt-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zeceipt command-line tool: issue, verify, pack, keygen"

[[bin]]
name = "zeceipt"
path = "src/main.rs"

[dependencies]
zeceipt-core = { path = "../zeceipt-core" }
zeceipt-lwd = { path = "../zeceipt-lwd" }
clap.workspace = true
anyhow.workspace = true
tokio.workspace = true
serde_json.workspace = true
hex.workspace = true
rand.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The issuer-binding lookup (spec §7): a small HTTPS GET on crates already in the tree (tonic's stack), so the
# connection can be pinned to the address that was checked (review W1 round 2).
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
serde_json.workspace = true
